# Copy of .github/workflows/ios-testflight.yml of the private repository, run on this PUBLIC repository's free runners
# while the account's billing blocks the private one (2026-09-23). The source is checked out from the private repository
# with SRC_TOKEN; secrets mirror the private repository's. Keep both in step: edit the private one, re-port with
# _archive/qa/port-public-workflows.py (or by hand).
name: iOS TestFlight (native shell) · public runner

# Builds the iPhone app on a GitHub macOS runner and uploads it to TestFlight, with no EAS build credits involved:
# the web layer is built here, `expo prebuild` writes the Xcode project, the app target is signed by hand with the
# distribution certificate and the App Store profile kept in the repo's secrets (the same identity EAS used, so the
# build lands on the same app record), and the App Store Connect API key uploads the IPA.
# Fire it with: gh workflow run ios-testflight.yml -f build=<CFBundleVersion> -f upload=1
# The build number must be above the last one Apple has for this version (EAS left 21 on 2026-09-21).

on:
  workflow_dispatch:
    inputs:
      build:
        description: "CFBundleVersion (a whole number above the last build Apple has)"
        required: true
      upload:
        description: "1 = upload to TestFlight; 0 = only keep the IPA as an artifact"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  ipa:
    # Expo SDK 57 (ExpoModulesJSI) needs Swift tools 6.2, i.e. Xcode 26: the macOS 26 image has it; macos-15 stops at 16.4
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ppfnfdcwiyjarvwlszta.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hyQC6Z8BY1_O5mghb7GV9A_yGmMcetC
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      # the source lives in the private repository: this public repository only lends its (free) runners
      - uses: actions/checkout@v4
        with:
          repository: fadhelcarlos/pillalo
          ref: main
          token: ${{ secrets.SRC_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      - name: Use Xcode 26 (Swift 6.2)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "no Xcode 26 on this runner:"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
          swift --version 2>&1 | head -1

      - name: Install web + native dependencies
        run: |
          npm ci
          cd native && npm ci

      - name: Build the web layer for the shell
        env:
          VITE_SUPABASE_URL: https://ppfnfdcwiyjarvwlszta.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_hyQC6Z8BY1_O5mghb7GV9A_yGmMcetC
          VITE_APP_ORIGIN: https://pillalo.live
        run: |
          cd native && npm run build:web
          grep -q "ppfnfdcwiyjarvwlszta" webapp/assets/app-*.js || { echo "web bundle is missing the Supabase URL"; exit 1; }
          cat webapp/build.json; echo

      - name: Prebuild the iOS project
        run: |
          cd native
          npx expo prebuild --platform ios --no-install
          cd ios && pod install --repo-update
          ls -d *.xcworkspace

      - name: Import the signing identity and the profile
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"; KEYPASS="$(uuidgen)"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYPASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "profile: $NAME ($UUID)"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign the app target by hand and stamp the build number
        run: cd native && node scripts/ios-sign.mjs "$PROFILE_NAME" "${{ github.event.inputs.build }}" 1.1.0

      - name: Archive
        run: |
          set -o pipefail
          cd native/ios
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|Signing Identity|Provisioning Profile|\*\* ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log" || { echo "archive failed; last lines:"; tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export the IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>APBP8V6275</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key><dict><key>com.carlosfadhel.pillalo</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" 2>&1 | tail -20
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1); echo "IPA=$IPA" >> "$GITHUB_ENV"; ls -la "$IPA"
          cp "$IPA" "$RUNNER_TEMP/Pillalo-1.1.0-${{ github.event.inputs.build }}.ipa"

      - name: Keep the archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pillalo-1.1.0-${{ github.event.inputs.build }}
          path: ${{ runner.temp }}/Pillalo-1.1.0-${{ github.event.inputs.build }}.ipa

      - name: Upload to TestFlight
        if: github.event.inputs.upload == '1'
        env:
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          if xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -15; then
            echo "uploaded with altool"
          else
            echo "altool could not upload; trying fastlane pilot"
            KEY_JSON="$RUNNER_TEMP/asc-key.json"
            node -e "const fs=require('fs');fs.writeFileSync(process.argv[1],JSON.stringify({key_id:process.env.ASC_KEY_ID,issuer_id:process.env.ASC_ISSUER_ID,key:fs.readFileSync(process.env.HOME+'/private_keys/AuthKey_'+process.env.ASC_KEY_ID+'.p8','utf8'),in_house:false}))" "$KEY_JSON"
            fastlane pilot upload --api_key_path "$KEY_JSON" --ipa "$IPA" --skip_waiting_for_build_processing --skip_submission
          fi
